description = "Hinge legs in Bambu PETG Basic on a P1S, printed on their side"
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"
filament = "Bambu PETG Basic @BBL X1C"

[process_overrides]
curr_bed_type = "Textured PEI Plate"
wall_loops = 4
sparse_infill_density = "25%"
sparse_infill_pattern = "gyroid"
brim_type = "brim_ears"           # small parts: ears for plate adhesion
# Raise these until ears land on the leg's corners:
# brim_ears_max_angle = 125
# brim_ears_detection_length = 1
