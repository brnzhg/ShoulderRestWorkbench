description = "Rest body in Bambu PETG Basic on a P1S: flat mounting face on the bed"
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"   # P1S uses the X1C process presets
filament = "Bambu PETG Basic @BBL X1C"

# Keys are Bambu Studio setting names (see a sliced file's project settings).
[process_overrides]
curr_bed_type = "Textured PEI Plate"
wall_loops = 4                    # strength and springiness
sparse_infill_density = "25%"     # 25-30%: lets the part flex
sparse_infill_pattern = "gyroid"
enable_support = 1                # leg cavities and rod channels open onto the bed
support_on_build_plate_only = 1

[filament_overrides]
# Dry PETG at 65 C for 8 hours first. To reduce warping, consider slowing down
# and an auxiliary fan of 0-30%: additional_cooling_fan_speed = 20
