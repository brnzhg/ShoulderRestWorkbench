[project]
name = "shoulder-rest-workbench"
version = "0.1.0"
description = "Build, slice and track versions of a personal shoulder rest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1",
    "shoulder-rest[render]",
    "tomlkit>=0.13.2",
]

[project.scripts]
srw = "rest_workbench.cli:main"

[tool.uv.sources]
shoulder-rest = { path = "ShoulderRest", editable = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rest_workbench"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ocp-vscode>=4.1.0",
    "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
module = ["ocp_vscode"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = ["ShoulderRest"]

[tool.ruff.lint]
ignore = [
    "I001",    # Keep imports compact, as in the library.
]
